<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="55%" stop-color="#1b1b2a"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f38ba8"/>
      <stop offset="55%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#fondo)"/>

  <!-- panel 3200x2136 (la resolucion real del o82) -->
  <g transform="translate(905 118) rotate(-6)">
    <rect x="0" y="0" width="270" height="180" rx="10" fill="url(#panel)" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="14" y="14" width="242" height="152" rx="4" fill="none" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="135" cy="90" r="26" fill="none" stroke="#f38ba8" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="135" cy="90" r="6" fill="#f38ba8" fill-opacity="0.8"/>
    <text x="135" y="206" text-anchor="middle" font-family="monospace" font-size="15" fill="#89b4fa" fill-opacity="0.75">3200 × 2136</text>
  </g>

  <!-- barra de estado -->
  <g font-family="monospace" font-size="15" fill="#a6adc8">
    <rect x="0" y="596" width="1280" height="44" fill="#000000" fill-opacity="0.35"/>
    <text x="40" y="624" fill="#89b4fa">root@uke</text>
    <text x="175" y="624" fill="#7f849c">~</text>
    <text x="200" y="624" fill="#a6e3a1">7.2.9-senemos.1.4054.3-ouke5</text>
    <text x="560" y="624" fill="#f9e2af">aarch64</text>
    <text x="700" y="624" fill="#7f849c">·</text>
    <text x="725" y="624" fill="#cba6f7">Omarchy 4.0.6</text>
    <text x="905" y="624" fill="#7f849c">·</text>
    <text x="930" y="624" fill="#f38ba8">SM7675</text>
  </g>

  <!-- titulo -->
  <text x="80" y="150" font-family="sans-serif" font-size="62" font-weight="700" fill="#cdd6f4">Omarchy en la</text>
  <text x="80" y="222" font-family="sans-serif" font-size="62" font-weight="700" fill="#cdd6f4">Xiaomi Pad 7</text>
  <text x="80" y="272" font-family="sans-serif" font-size="30" font-weight="400" fill="#f38ba8">«uke»</text>
  <text x="185" y="272" font-family="sans-serif" font-size="30" fill="#89b4fa">Snapdragon 7+ Gen 3 · SM7675 · aarch64</text>

  <rect x="80" y="308" width="180" height="4" fill="url(#acento)"/>

  <text x="80" y="360" font-family="sans-serif" font-size="22" fill="#a6adc8">Arch Linux ARM + Hyprland 0.56 + Quickshell</text>
  <text x="80" y="396" font-family="sans-serif" font-size="22" fill="#a6adc8">kernel mainline propio · arranque desde boot.img (A/B), sin UEFI</text>

  <g font-family="monospace" font-size="19" fill="#7f849c">
    <text x="80" y="452"># port · # tablet · # mainline · # aarch64</text>
  </g>

  <text x="80" y="512" font-family="sans-serif" font-size="19" fill="#6c7086">Cuaderno de trabajo de un port real: informes, parches, scripts y errores.</text>
  <text x="80" y="540" font-family="sans-serif" font-size="19" fill="#6c7086">Experimental. No es una distribucion instalable.</text>
</svg>
