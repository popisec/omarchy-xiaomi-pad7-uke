# hyprland-touch-pen.conf — táctil + lápiz en Hyprland 0.56 (config clásica)
# Incluir desde hyprland.conf:   source = ~/.config/hypr/uke-touch.conf
#
# TRANSFORM: el IC reporta el marco NATIVO 2136 (X) x 3200 (Y) = retrato; el
# panel se usa apaisado (3200x2136). libinput mapea el device al output, así que
# hace falta rotar el táctil/lápiz 90º (transform 1 o 3 según el montaje).
# Cómo decidirlo (test de esquinas, ver P2-lapiz.md §(e)):
#   libinput debug-events --device /dev/input/eventN   y tocar la esquina
#   superior-izquierda CON la pantalla en apaisado; probar 1 y 3 hasta que el
#   toque caiga bajo el dedo en las 4 esquinas.
#
# NOTA (C §2.3, D §7): input:tablet:transform "se setea pero no hace nada" en
# algunos casos (issues 11944/4856); la vía que funciona es rotar el MONITOR
# con hl.monitor{transform=...} y el touchdevice/tablet con hl.config.
# Hyprland 0.56 con config Lua: usar hyprland-touch-pen.lua, no este fichero.

input {
    touchdevice {
        transform = 1
    }
    tablet {
        transform = 1
    }
}
