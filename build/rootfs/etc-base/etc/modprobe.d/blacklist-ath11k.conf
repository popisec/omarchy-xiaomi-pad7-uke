# /etc/modprobe.d/blacklist-ath11k.conf — FUENTE en repo (etc-base/), se hornea
# en la imagen vía staging/etc/modprobe.d/ (instalador: build/gates/instala-blacklist-ath11k.sh).
#
# POR QUÉ EXISTE. En la tablet, udev autocarga ath11k+ath11k_ahb por modalias a
# t≈26 s, ANTES de que wifi-pmu/pwrseq estén listos; el probe entra en
# -EPROBE_DEFER y, cuando el pwrseq ya está, el probe completo muere en un reset
# silencioso a ~7,33 s que GASTA reintentos de slot (LECCIONES.md ronda 39 §4:
# "La autocarga de ath11k es un bucle que se come el margen del slot"; ledger
# #441 §1: causa raíz = uke-wifi-trace.sh:46 borra esta blacklist y no la
# restaura; ledger #441 §3: 3/3 muertes a 7.319/7.333/7.350 s).
#
# La blacklist SOLO bloquea la resolución de alias (autocarga por udev); el
# `modprobe ath11k` / `modprobe ath11k_ahb` EXPLÍCITO sigue funcionando
# (ledger #442 §1: "modprobe explícito sigue funcionando con blacklist").
# Por eso el procedimiento de prueba es: blacklist puesta SIEMPRE, quitarla a
# mano solo durante el probe, volver a ponerla + sync después.
blacklist ath11k
blacklist ath11k_ahb
blacklist ath11k_pci
