# UCM «UKE» HiFi — SOLO CAPTURA. Plantilla: Qualcomm/sm8650/QRD/HiFi.conf (alsa-ucm-conf 1.2.16.1) + rutas de Android (odm-mixer_paths_overlay_static.xml).
# NO define Speaker/Headphones A PROPOSITO: la salida de altavoces la crea /etc/pipewire/pipewire.conf.d/51-uke-speakers.conf (cadena con paso alto, ganancia y limite
# de pico + amps FS19xx); una segunda salida por UCM duplicaria el dispositivo sin esa proteccion.
# El PCM de captura (MultiMedia3 -> TX_CODEC_DMA_TX_3) se asume en hw:${CardId},2 como en la QRD: VERIFICAR en M2 con `arecord -l`.
Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

# Micro frontal/inferior (AMIC1 «sidebottom» en Android; en la QRD «Mic1»): ADC1 + SWR_MIC0.
SectionDevice."Mic1" {
	Comment "Micro inferior (AMIC1)"

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

# Micro trasero (AMIC4 «back» en la QRD): ADC1 con CH1_AMIC4.
SectionDevice."Mic2" {
	Comment "Micro trasero (AMIC4)"

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic4EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 1
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}
