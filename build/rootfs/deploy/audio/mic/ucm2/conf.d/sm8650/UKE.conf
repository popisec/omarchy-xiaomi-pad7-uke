# UCM de la tarjeta «UKE» (Xiaomi Pad 7, SM8650): altavoces TDM (FS19xx) + captura del WCD9395. BORRADOR M0 (20-oct-2026), NO probado.
# Instalar en /usr/share/alsa/ucm2/conf.d/sm8650/UKE.conf y /usr/share/alsa/ucm2/Qualcomm/uke/HiFi.conf (no son ficheros del paquete alsa-ucm-conf).
SectionUseCase."HiFi" {
	File "/Qualcomm/uke/HiFi.conf"
	Comment "HiFi: altavoces TDM (via PipeWire uke-speakers) y microfonos analogicos AMIC del WCD9395."
}
