# 51-uke-mic.conf — micro interno de la uke como fuente de PipeWire. BORRADOR M0 (20-oct-2026), NO instalado ni probado. Requiere la tarjeta e9a (TDM + captura WCD9395) y la ruta de
# mezclador `mic/uke-mic-route.sh --apply amic1` (o la del UCM «UKE»). El PCM de captura (MultiMedia3 -> TX_CODEC_DMA_TX_3) se asume en hw:UKE,2: VERIFICAR en M2 con `arecord -l`.
# nofail: sin la tarjeta (arranque sin audio, e8b en vez de e9a, interruptor) PipeWire DEBE seguir arrancando (la conf de altavoces ya fallo asi: ver 51-uke-speakers.conf).
# S16LE 48 kHz 2 canales (el PCM MultiMedia3 Capture SOLO ofrece 2 canales y periodo >= 1920 frames: medido con --dump-hw-params en M3; el micro mono llega al canal 0 y el canal 1 es silencio) sin mmap (como aplay/arecord, lo probado en los altavoces); suspension a los 5 s para soltar el PCM.
context.objects = [
    {   factory = adapter
        flags = [ nofail ]
        args = {
            factory.name          = api.alsa.pcm.source
            node.name             = "uke-mic"
            node.description      = "Micro interno (UKE)"
            media.class           = Audio/Source
            api.alsa.path         = "hw:UKE,2"
            audio.format          = S16LE
            audio.rate            = 48000
            audio.channels        = 2
            audio.position        = [ FL FR ]
            api.alsa.period-size  = 1920
            api.alsa.disable-mmap = true
            api.alsa.use-chmap    = false
            session.suspend-timeout-seconds = 5
            priority.session     = 1000
            priority.driver      = 1000
        }
    }
]
