# 50-uke-null-sink.conf — ETAPA E1 del plan de audio (AUDIO-SENEMOS-20261018.md §6), preparado en E0 (18-oct-2026).
#
# Un sumidero NULO de PipeWire: existe como dispositivo (wpctl / barra de volumen de Omarchy / aplicaciones),
# acepta audio y lo descarta. NO ES AUDIO DE LA TABLET: no toca ALSA, ni el ADSP, ni remoteproc, ni ningun
# modulo del kernel. Cuando haya un dispositivo real (Bluetooth A2DP, WCD, altavoces) gana por prioridad y este
# sumidero deja de ser el predeterminado; se puede borrar este fichero sin mas.
#
# Instalacion (a mano, ver README.md §E1): copiar a /etc/pipewire/pipewire.conf.d/ en la tablet (global) o a
# ~/.config/pipewire/pipewire.conf.d/ (solo el usuario de la sesion Omarchy) y reiniciar PipeWire:
#     systemctl --user restart pipewire pipewire-pulse wireplumber
# Comprobar:  wpctl status   ->  "Audio > Sinks: * Uke (sin audio fisico)"     (pipewire 1.6.9, wireplumber 0.5.18)
#
# priority.session = 100: muy por debajo de los sumideros reales (ALSA ~1000+, BlueZ ~1010), asi que WirePlumber
# solo lo elige como predeterminado cuando NO hay otro. `object.linger = true` lo mantiene aunque no haya clientes.
# `monitor.channel-volumes = true`: el volumen del sumidero tambien se aplica a su monitor (el slider "se nota").
# audio.rate fijo a 48 kHz (la topologia AudioReach de la uke es de 48 kHz).
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "uke-null-sink"
            node.description        = "Uke (sin audio fisico)"
            node.nick               = "Uke null"
            media.class             = Audio/Sink
            object.linger           = true
            audio.rate              = 48000
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
            priority.session        = 100
            priority.driver         = 100
        }
    }
]
