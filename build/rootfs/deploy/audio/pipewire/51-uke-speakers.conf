# 51-uke-speakers.conf — ETAPA E9: los altavoces internos de la uke como sumidero de PipeWire (preparado el 19-oct-2026, sin instalar).
# Requiere la etapa 2 del audio (uke-audio-amps.service: tarjeta ALSA «UKE», 4 FS19xx con uke_fs_play=1, tope uke_fs_volmax).
#
# Dos nodos:
#  1) "uke-alsa-sink": PCM crudo hw:UKE,0, S16LE 48 kHz estereo (q6apm-dai SOLO ofrece S16/S24 y S24 ha tirado el ADSP: no cambiar el formato),
#     sin mmap (como aplay, que es lo probado), period 1024 y suspension a los 5 s de silencio (al soltar el PCM el driver PARA los amps).
#     priority.session bajo: no es para elegirlo a mano (no tiene limitador).
#  2) "uke-speakers" (el que ve el usuario): filter-chain con el PASO ALTO REAL de Android (FSADSP, ACDB Forte: Butterworth de 6o orden a 70 Hz = 3 biquads con Q 1,932/0,707/0,517) y ganancia fija x0.25 (-12 dBFS a escala completa) y limite duro ±0.3 (≈ -10,5 dBFS)
#     por canal. Es la UNICA proteccion de excursion/termica ademas de uke_fs_volmax: Android usa FSADSP, que aqui NO existe. El dueño oyo
#     el tono de -24 dBFS (0,063) con vol 0xE0 a 20-30 cm. Para subir: cambiar Mult/Max aqui, de uno en uno y midiendo.
# Instalar (a mano; ver deploy-speakers.sh):  /etc/pipewire/pipewire.conf.d/  y reiniciar pipewire de la sesion Omarchy.
# Quitar: borrar el fichero y reiniciar pipewire. NO toca modulos del kernel ni remoteproc.
context.objects = [
    {   factory = adapter
        # nofail: si la tarjeta UKE aun no existe al arrancar PipeWire (audio apagado, arranque en frio, interruptor no-audio) PipeWire DEBE seguir
        # arrancando (sin el, 'can't create object from factory adapter' tumba todo PipeWire: sin audio ni BT; visto en el primer arranque ouke5).
        # Si la tarjeta aparece despues, reiniciar pipewire de la sesion: systemctl --user restart pipewire pipewire-pulse wireplumber
        flags = [ nofail ]
        args = {
            factory.name          = api.alsa.pcm.sink
            node.name             = "uke-alsa-sink"
            node.description      = "UKE altavoces (crudo, sin limitador)"
            media.class           = Audio/Sink
            api.alsa.path         = "hw:UKE,0"
            audio.format          = S16LE
            audio.rate            = 48000
            audio.channels        = 2
            audio.position        = [ FL FR ]
            api.alsa.period-size  = 1024
            api.alsa.disable-mmap = true
            api.alsa.use-chmap    = false
            session.suspend-timeout-seconds = 5
            priority.session      = 10
            priority.driver       = 10
        }
    }
]
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Altavoces de la tablet (UKE)"
            media.name       = "Altavoces de la tablet (UKE)"
            filter.graph = {
                nodes = [
                    { type = builtin name = hp1_l label = bq_highpass control = { Freq = 70.0 Q = 1.932 Gain = 0.0 } }
                    { type = builtin name = hp2_l label = bq_highpass control = { Freq = 70.0 Q = 0.707 Gain = 0.0 } }
                    { type = builtin name = hp3_l label = bq_highpass control = { Freq = 70.0 Q = 0.517 Gain = 0.0 } }
                    { type = builtin name = hp1_r label = bq_highpass control = { Freq = 70.0 Q = 1.932 Gain = 0.0 } }
                    { type = builtin name = hp2_r label = bq_highpass control = { Freq = 70.0 Q = 0.707 Gain = 0.0 } }
                    { type = builtin name = hp3_r label = bq_highpass control = { Freq = 70.0 Q = 0.517 Gain = 0.0 } }
                    { type = builtin name = gain_l label = linear control = { Mult = 0.25 Add = 0.0 } }
                    { type = builtin name = gain_r label = linear control = { Mult = 0.25 Add = 0.0 } }
                    { type = builtin name = lim_l  label = clamp  control = { Min = -0.3 Max = 0.3 } }
                    { type = builtin name = lim_r  label = clamp  control = { Min = -0.3 Max = 0.3 } }
                ]
                links = [
                    { output = "hp1_l:Out" input = "hp2_l:In" }
                    { output = "hp2_l:Out" input = "hp3_l:In" }
                    { output = "hp3_l:Out" input = "gain_l:In" }
                    { output = "gain_l:Out" input = "lim_l:In" }
                    { output = "hp1_r:Out" input = "hp2_r:In" }
                    { output = "hp2_r:Out" input = "hp3_r:In" }
                    { output = "hp3_r:Out" input = "gain_r:In" }
                    { output = "gain_r:Out" input = "lim_r:In" }
                ]
                inputs  = [ "hp1_l:In" "hp1_r:In" ]
                outputs = [ "lim_l:Out" "lim_r:Out" ]
            }
            audio.rate     = 48000
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "uke-speakers"
                media.class    = Audio/Sink
                priority.session = 1000
                priority.driver  = 1000
            }
            playback.props = {
                node.name     = "uke-speakers-out"
                node.passive  = true
                target.object = "uke-alsa-sink"
            }
        }
    }
]
