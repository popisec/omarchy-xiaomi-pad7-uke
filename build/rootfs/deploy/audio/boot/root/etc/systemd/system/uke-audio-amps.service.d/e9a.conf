# Drop-in: la etapa 2 carga la tarjeta COMBINADA e9a (altavoces TDM + captura del WCD9395) en vez de e8b. BORRADOR del PC (21-oct-2026); se instala con mic/deploy-persist-e9a.sh.
# Si el WCD9395 no se carga/adjunta, el guion cae solo a e8b (altavoces, exit 2 AMARILLO, que este servicio acepta): nunca deja la tablet sin audio.
# Quitar: borrar este fichero y `systemctl daemon-reload` (o `touch /etc/uke/no-audio-amps` para apagar toda la etapa 2).
[Service]
Environment=UKE_AUDIO_CARD_MOD=uke_audio_e9a
Environment=UKE_AUDIO_MIC_ROUTE=amic1
