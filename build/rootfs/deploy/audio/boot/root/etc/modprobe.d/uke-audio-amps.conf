# uke audio E8: parametros de los 4 FS19xx al cargar. uke_fs_play=1: al sonar un PCM se inicializan y habilitan los amps (parados al terminar).
# 0xE0 = el volumen con el que el dueño oyo el tono de prueba (Android usa 235..243). uke_fs_volmax es TOPE DURO (tambien para el mando FS19XX Volume):
# sin la proteccion FSADSP de Android no subir sin medir temperatura/excursion. Cambiar aqui y reiniciar (o echarlo a /sys/module/uke_fs19xx/parameters/).
options uke_fs19xx uke_fs_play=1 uke_fs_vol=224 uke_fs_volmax=224
