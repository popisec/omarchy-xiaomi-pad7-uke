// uke T5 (18-oct-2026): ajustes tactiles de Firefox. defaultPref = valor por defecto; el usuario puede cambiarlos.
// (La primera linea de este fichero debe ser un comentario.)
// pulsacion larga -> menu contextual (clic derecho)
defaultPref("ui.click_hold_context_menus", true);
// pellizco y zoom con APZ (desplazamiento asincrono tactil)
defaultPref("apz.allow_zooming", true);
defaultPref("apz.allow_double_tap_zooming", true);
defaultPref("apz.fling_friction", "0.002");
defaultPref("dom.w3c_touch_events.enabled", 2);
defaultPref("browser.tabs.hoverPreview.enabled", false);
defaultPref("browser.uidensity", 2);
defaultPref("general.smoothScroll", true);
defaultPref("widget.use-xdg-desktop-portal.file-picker", 1);
// privacidad
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("toolkit.telemetry.unified", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("app.shield.optoutstudies.enabled", false);
