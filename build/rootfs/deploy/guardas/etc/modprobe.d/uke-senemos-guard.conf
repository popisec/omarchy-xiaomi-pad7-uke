# uke-senemos-guard.conf — 17-oct-2026, kernel senemos ouke2 recien con /lib/modules completo.
# Modulos que udev autocargaria por modalias en el PROXIMO arranque y que aun no se han probado en este
# kernel (lista medida: modalias de /sys/devices -> modprobe -R -> solo los .ko, ver /root/autoload-candidatos.txt).
# Un cuelgue en el arranque con autoload es un bucle que gasta reintentos de slot (LECCIONES ronda 39 §4).
# `blacklist` solo frena el autoload por alias: `modprobe <nombre>` explicito sigue funcionando para probarlos
# en caliente. Quitar cada linea SOLO tras probar ese modulo en vivo sin cuelgue.
# gpucc_cliffs QUITADO (17-oct noche): probado en vivo sin cuelgue (modprobe + E1) y en ouke3 es built-in
# (CONFIG_SM_GPUCC_CLIFFS=y). Bloquearlo dejaba al SMMU de la GPU en -110 (GPU-SENEMOS-20261017.md).
blacklist hci_uart
blacklist coresight_funnel
blacklist qcom_cpucp_mbox
blacklist qcomtee
