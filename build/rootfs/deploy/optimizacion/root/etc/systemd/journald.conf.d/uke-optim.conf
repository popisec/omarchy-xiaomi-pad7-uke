# uke optimizacion 20-oct-2026: el journal llego a 747 MB con / al 89 %. Tope y menos escrituras a UFS.
[Journal]
SystemMaxUse=150M
SystemKeepFree=600M
SystemMaxFileSize=16M
MaxFileSec=1week
# = valor por defecto de systemd; ERR o superior se sincroniza al instante (diagnostico de cuelgues: lo grave llega a disco)
SyncIntervalSec=5m
