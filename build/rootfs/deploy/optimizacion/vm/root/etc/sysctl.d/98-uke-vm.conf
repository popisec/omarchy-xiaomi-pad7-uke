# uke (23-oct-2026, ram-optim). Revertir: borrar el fichero y `sysctl -w vm.stat_interval=1 vm.dirty_background_bytes=0 vm.dirty_bytes=0`.
# vmstat cada 10 s en vez de cada 1 s: menos despertares por CPU; solo afecta a la frescura de /proc/vmstat.
vm.stat_interval=10
# El ext4 de / NO tiene journal: con los ratios 10/20 cabian ~740 MB sucios en RAM. Acotado a 64/256 MB (menos que perder tras un corte).
vm.dirty_background_bytes=67108864
vm.dirty_bytes=268435456
