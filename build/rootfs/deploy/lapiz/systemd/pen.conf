# Drop-in de uke-touch.service: arranca el demonio parcheado con --pen. /etc/systemd/system/uke-touch.service.d/pen.conf
# INTERRUPTOR sin reflashear: `touch /etc/uke/no-pen` desactiva el lapiz (sigue el tactil con el demonio original).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -e /etc/uke/no-pen ] || [ ! -f /usr/local/share/uke/tactil/uke-touchd-pen.py ]; then exec /usr/bin/python3 -u /usr/local/share/uke/tactil/uke-touchd.py; else exec /usr/bin/python3 -u /usr/local/share/uke/tactil/uke-touchd-pen.py --pen; fi'
# El demonio parcheado ya trata SIGTERM (desactiva el modo lapiz del chip y sale)
KillSignal=SIGTERM
TimeoutStopSec=10
