# 10-uke-s2idle.conf — suspension de la uke (kernel senemos) SOLO por s2idle (18-oct-2026).
# Validado por etapas (build/rootfs/deploy/suspension/README.md): pm_test freezer y devices, y s2idle real 20 s con
# despertar por alarma RTC (pm8xxx_rtc_alarm), todo de vuelta (WiFi, tactil, carga, display). El modo 'deep' (PSCI
# SYSTEM_SUSPEND), que es el mem_sleep por defecto del kernel, NO esta probado: systemd no debe usarlo.
# Hibernacion: sin swap ni probar; sus targets siguen enmascarados.
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
MemorySleepMode=s2idle
