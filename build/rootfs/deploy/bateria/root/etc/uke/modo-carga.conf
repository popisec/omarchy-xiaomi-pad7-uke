# Modo carga: si el arranque lo provoco el cargador (bootinfo.pureason de la cmdline), no se inicia el escritorio.
# Valores de pureason que cuentan como «encendida por cargador» (separados por espacios). 0x40010 = poweroff + cargador (19-oct, hipotesis por observacion).
PUREASON_CARGADOR="0x40010"
# Pulsar el boton de encendido en modo carga arranca el escritorio. Forzar escritorio siempre: touch /var/lib/uke-bateria/forzar-escritorio
