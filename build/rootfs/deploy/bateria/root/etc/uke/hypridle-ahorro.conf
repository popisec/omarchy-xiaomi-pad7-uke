# T1/T6a (18-oct-2026; tiempos alargados a peticion del dueno: 5/10/30 min): sin teclado no hay bloqueo. Atenuar -> pantalla fuera -> suspender.
# Perfil Ahorro (uke-perfil): 1 / 2 / 10 min. Gestionada por uke-perfil.
general {
    # Sin lock_cmd/before_sleep_cmd: nunca se bloquea.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1 min: atenuar al 5 % (restaura al volver)
listener {
    timeout = 60
    on-timeout = brightnessctl -sd uke-backlight set 5%
    on-resume = brightnessctl -rd uke-backlight
}

# 2 min: pantalla fuera (el táctil se recarga solo: uke-touchd vigila el panel)
listener {
    timeout = 120
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 10 min: suspender (sin bloqueo)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
