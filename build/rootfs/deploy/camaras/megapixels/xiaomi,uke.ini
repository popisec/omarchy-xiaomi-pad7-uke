; Megapixels 1.8.3 — Xiaomi Pad 7 «uke» (SM7675 / cliffs). 22-oct-2026, sesión de cámaras (ciclos 16–23).
; Requiere los módulos de cámara de build/rootfs/deploy/camaras (camss compilado como «qcom-camss», out-ciclo23) y el parche
; 0001-mode-stride-16-qcom-camss.patch (camss alinea cada fila a 16 bytes). Las dos cámaras salen por csid0 -> vfe0_rdi0:
; Megapixels usa el PRIMER nodo de vídeo del media device para todas.
[device]
make=Xiaomi
model=Pad 7

[rear]
; OV13B10 (módulo OFILM), 4 lanes por csiphy1, SGRBG10 empaquetado. Medido: 4208x3120 y 2104x1560 dan frames completos (ciclos 16 y 20).
driver=ov13b10
media-driver=qcom-camss
rotate=0
capture-width=4208
capture-height=3120
capture-rate=30
capture-fmt=GRBG10P
preview-width=2104
preview-height=1560
preview-rate=30
preview-fmt=GRBG10P
media-links=ov13b10:0->msm_csiphy1:0,msm_csiphy1:1->msm_csid0:0,msm_csid0:1->msm_vfe0_rdi0:0
blacklevel=64
whitelevel=1023

[front]
; OV08D10 (módulo AAC), 2 lanes por csiphy4. Verificado 22-oct (ciclos 24-25 y foto en Megapixels): sale girada 180° -> rotate=180.
driver=ov08d10
media-driver=qcom-camss
rotate=180
mirrored=true
capture-width=3264
capture-height=2448
capture-rate=30
capture-fmt=BGGR10P
preview-width=1632
preview-height=1224
preview-rate=30
preview-fmt=BGGR10P
media-links=ov08d10:0->msm_csiphy4:0,msm_csiphy4:1->msm_csid0:0,msm_csid0:1->msm_vfe0_rdi0:0
blacklevel=64
whitelevel=1023
