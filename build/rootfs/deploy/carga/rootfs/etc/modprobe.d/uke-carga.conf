# uke-carga.conf — orden de carga determinista para la pila de carga (kernel senemos).
# `blacklist` solo frena el autoload por ALIAS (udev/coldplug); `modprobe <nombre>`
# explícito (uke-carga-start.sh) NO se ve afectado. En los kernels palawan estos
# drivers son built-in, así que aquí no tiene efecto.
#
# qcom_q6v5_pas: su parche 0033 auto-arranca el ADSP al probar. Tiene que cargarse el
# ÚLTIMO, con firmware verificado y con qrtr + pd_mapper + pmic_glink + battmgr ya
# cargados. (El mismo módulo gestiona luego el WPSS/WiFi: ese servicio debe ir
# After=uke-carga.service.)
blacklist qcom_q6v5_pas
# GPR/APR (nodo qcom,gpr vivo en su DT; 0027 acepta reg=<2>) y FastRPC no hacen falta para
# cargar, arrastran el audio q6 y el camino SLIM/DMA que su 0033 llama "no cualificado".
blacklist apr
blacklist fastrpc
# Solo carga: sin UCSI ni altmode (pmic_glink es battery-only, 0032).
blacklist ucsi_glink
blacklist pmic_glink_altmode
