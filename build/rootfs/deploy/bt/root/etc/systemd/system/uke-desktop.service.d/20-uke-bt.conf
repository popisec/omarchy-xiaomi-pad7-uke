# uke: el panel de Bluetooth del shell de Omarchy (Quickshell.Bluetooth) NO se reengancha a BlueZ si el shell arranca antes que
# bluetoothd (medido el 18-oct: `Failed to create DBusObjectManagerInterface for "org.bluez"`, tambien en el arranque en frio de
# las 16:32). Esta espera ACOTADA (<= 25 s, siempre sale con exito) retrasa el arranque de sddm hasta que org.bluez este en el bus.
# Sin dependencias duras: si el BT falla, esta apagado (/etc/uke/no-bt) o tarda, el escritorio arranca igual.
[Service]
ExecStartPre=-/usr/local/sbin/uke-bt-wait
