# uke: bluetoothd arranca DESPUES de uke-bt.service (que carga el overlay de DT + hci_uart y espera a 'QCA setup on UART is
# completed'). Sin esto, bluetoothd podria abrir el adaptador mientras el chip aun esta en setup (carrera) o antes de que
# el WiFi/WPSS este estable (uke-bt espera su colchón). Informe BT-DIARIO-PLAN-20261018.md §2.1.
# Wants= (no Requires=): si uke-bt falla o se omite (interruptor /etc/uke/no-bt, guarda), bluetooth.service no hereda el fallo;
# sin hci0 su propio ConditionPathIsDirectory=/sys/class/bluetooth ya lo omite.
[Unit]
After=uke-bt.service
Wants=uke-bt.service
