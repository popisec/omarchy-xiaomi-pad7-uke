# wlan0 ya no es de networkd (la gestiona NetworkManager, deploy/wifi-omarchy) y usb0 es RequiredForOnline=no, asi que
# wait-online no tenia nada que esperar y fallaba por timeout. Se le pide solo usb0 (siempre presente en la uke).
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --interface=usb0 --timeout=15
