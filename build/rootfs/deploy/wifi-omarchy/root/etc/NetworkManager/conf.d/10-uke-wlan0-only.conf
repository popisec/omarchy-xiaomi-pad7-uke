# NetworkManager SOLO para wlan0 (el panel de red de Omarchy exige el backend NetworkManager de Quickshell).
# usb0 (RNDIS, acceso de servicio a 192.168.42.129) y cualquier otro dispositivo quedan UNMANAGED:
# la gestiona systemd-networkd (10-uke-usb.network), NM no la toca.
[main]
plugins=keyfile
no-auto-default=*
# DNS por systemd-resolved (NM no reescribe /etc/resolv.conf, que es 'foreign').
dns=systemd-resolved

[keyfile]
unmanaged-devices=except:interface-name:wlan0

[device]
# La MAC de wlan0 la fija 10-uke-wlan.link; no aleatorizar al escanear.
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=preserve
