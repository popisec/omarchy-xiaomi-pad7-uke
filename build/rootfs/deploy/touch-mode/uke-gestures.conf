# ~/.config/uke-gestures.conf — gestos de la tablet uke (T4 + touch-mode v2). Recarga: systemctl --user kill -s HUP uke-gestures
# Distancias en pixeles FISICOS del panel (3200x2136, ~13 px/mm). Orientacion: se lee del monitor (hyprctl) al tocar.
# Prueba en vivo: touch-mode/deploy.sh log   (o: python3 -I /usr/local/share/uke/gestures/uke-gestures.py --log)
[gestures]
edge_margin = 40
edge_dist = 220
edge_max_lateral = 0.8
edge_time_ms = 900
three_dist = 300
three_dominance = 1.5
three_time_ms = 1200
cooldown_ms = 500
monitor =
rotation_poll_s = 2
# pellizco de 3 dedos: radio medio final/inicial; el centroide no se mueve mas de pinch_move_max
pinch_in = 0.65
pinch_out = 1.5
pinch_move_max = 150
# 2 dedos desde un borde (los dos empiezan en el margen, el 2.o a menos de two_edge_window_ms del 1.o)
two_edge_dist = 200
two_edge_window_ms = 250
two_edge_time_ms = 900
# toque con 2 dedos (clic derecho): corto, simultaneo y sin mover (si se mueven es scroll/pellizco y no se toca)
tap2_time_ms = 350
tap2_window_ms = 150
tap2_move = 50

# Comando por gesto (sh -c, con XDG_RUNTIME_DIR y HYPRLAND_INSTANCE_SIGNATURE ya puestos). Vacio = desactivado.
# Acciones especiales: "@rightclick" (clic derecho donde tocas) y "@key alt+left" (combinacion por teclado virtual uinput).
# edge_* = 1 dedo desde el borde; two_edge_* = 2 dedos desde el borde; three_* = 3 dedos; bordes y direcciones VISUALES.
[actions]
edge_top = omarchy-shell omarchy.power toggle
# TECLADO PRINCIPAL = plugin omarkyy.tablet (fork uke). Antes (squeekboard): /usr/local/bin/uke-osk-toggle
edge_bottom = omarchy-shell omarkyy.tablet keyboard
edge_left =
edge_right =
three_down = hyprctl eval 'hl.dispatch(hl.dsp.window.close())'
three_up = omarchy-shell uke.launcher toggle
# 3 dedos de lado = app siguiente/anterior: m+-1 salta solo entre escritorios con ventanas (con una app por escritorio, r+-1 caia en vacios; ESCRITORIO-TACTIL 22-oct)
# (hl.gesture nativo es solo de touchpad, no de pantalla tactil: medido 18-oct)
three_left = hyprctl eval 'hl.dispatch(hl.dsp.focus({ workspace = "m+1" }))'
three_right = hyprctl eval 'hl.dispatch(hl.dsp.focus({ workspace = "m-1" }))'
# pellizco de 3 dedos: juntar = dividir con la ultima app / volver a una sola (uke_dividir en ~/.config/hypr/tablet.lua,
# ESCRITORIO-TACTIL 22-oct-2026); separar = pantalla completa
three_pinch_in = hyprctl eval 'uke_dividir()'
three_pinch_out = hyprctl eval 'hl.dispatch(hl.dsp.window.fullscreen({ mode = "fullscreen" }))'
# 2 dedos desde el borde: arriba = volumen/audio, abajo = girar 90 grados, izquierda = atras (Alt+Izq), derecha = adelante (Alt+Der)
two_edge_top = omarchy-shell omarchy.audio toggle
two_edge_bottom = omarchy-shell omarkyy.tablet rotate
two_edge_left = @key alt+left
two_edge_right = @key alt+right
# toque con 2 dedos = clic derecho
tap2 = @rightclick
