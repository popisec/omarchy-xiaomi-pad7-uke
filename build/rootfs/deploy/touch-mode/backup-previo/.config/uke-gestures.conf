# ~/.config/uke-gestures.conf — gestos de borde de la tablet uke (T4). Recarga: systemctl --user kill -s HUP uke-gestures
# Distancias en pixeles FISICOS del panel (3200x2136, ~13 px/mm). Orientacion: se lee del monitor (hyprctl) al tocar.
[gestures]
edge_margin = 40
edge_dist = 220
edge_max_lateral = 0.8
edge_time_ms = 900
three_dist = 300
three_dominance = 1.5
three_time_ms = 1200
cooldown_ms = 500
monitor =
rotation_poll_s = 2

# Comando por gesto (sh -c, con XDG_RUNTIME_DIR y HYPRLAND_INSTANCE_SIGNATURE ya puestos). Vacio = desactivado.
# edge_* = dedo que empieza en ese borde y entra; three_* = 3 dedos en esa direccion (bordes y direcciones VISUALES).
[actions]
edge_top = omarchy-shell omarchy.power toggle
# alternativas para el borde superior: omarchy-shell omarchy.audio toggle | omarchy.network toggle | omarchy.bluetooth toggle | notifications showHistory (repite los avisos recientes)
edge_bottom = /usr/local/bin/uke-osk-toggle
edge_left =
edge_right =
three_down = hyprctl eval 'hl.dsp.window.close()'
three_up = /usr/local/bin/uke-drawer-toggle
# 3 dedos de lado: vacio por defecto (looknfeel.lua ya tiene workspace_swipe_touch = true; evita duplicar)
three_left =
three_right =
