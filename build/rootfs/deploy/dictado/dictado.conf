# /etc/uke/dictado.conf — motor del dictado por voz del teclado (uke-dictar). 22-oct-2026.
# MOTOR=parakeet  -> sherpa-onnx + Parakeet TDT 0.6B v3 int8 (puntuacion y mayusculas; recomendado)
# MOTOR=whisper   -> whisper.cpp (MODELO_WHISPER en /usr/local/share/uke/dictado/modelos)
MOTOR=parakeet
HILOS=4
TASKSET="taskset -c 3-6"   # 4 nucleos grandes A720 (los 3 A520 frenan; medido en bench.sh)
#MODELO_WHISPER=ggml-large-v3-turbo-q5_0.bin
