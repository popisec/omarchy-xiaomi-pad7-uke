# T1/T6a (18-oct-2026; 20-oct: reposo acortado 2/3/15 min por orden del dueno, antes 5/10/30): sin teclado no hay bloqueo. Atenuar -> pantalla fuera -> suspender.
# Alineado con bateria/root/etc/uke/hypridle-normal.conf (uke-perfil lo gestiona segun perfil).
general {
    # Sin lock_cmd/before_sleep_cmd: nunca se bloquea.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 2 min: atenuar al 5 % (restaura al volver)
listener {
    timeout = 120
    on-timeout = brightnessctl -sd uke-backlight set 5%
    on-resume = brightnessctl -rd uke-backlight
}

# 3 min: pantalla fuera (el táctil se recarga solo: uke-touchd vigila el panel)
listener {
    timeout = 180
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min: suspender (sin bloqueo)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
