# Configuracion de gitleaks para este repo.
#
# Reglas por defecto de gitleaks + dos excepciones, ambas falsos positivos
# verificados (no son credenciales):
#
#   1. build/gates/prepara/install-omarchy-uke.sh:29
#      OMARCHY_KEY_FP="40DFB630FF42BCFFB047046CF0134EE680CAC571"
#      Huella SHA-1 PUBLICA de la keyring de Omarchy. Esta dentro del propio
#      paquete .pkg.tar.zst que descarga el script (firma de un repositorio
#      publico). No es una clave, ni un token, ni una contrasena.
#
#   2. build/rootfs/deploy/lapiz/desktop/palma-android/test_sim_palma.py:73
#      "dedo_sin_lapiz"
#      Nombre de un caso de prueba ("dedo sin lapiz"). La regla generic-api-key
#      lo marca por tener guion y sufijos.
#
# Si alguna vez aparecen credenciales reales, la CI las para: el escaneo es
# bloqueante.
[extend]
useDefault = true

[[allowlists]]
description = "Huella SHA-1 publica de la keyring de Omarchy (no es una credencial)"
regexTarget = "match"
regexes = [
  '''OMARCHY_KEY_FP="[0-9A-F]{40}"''',
]

[[allowlists]]
description = "Nombres de casos de prueba en castellano, no credenciales"
regexTarget = "secret"
regexes = [
  '''^dedo_sin_lapiz$''',
  '''^dedo_500ms_tras_lapiz$''',
]

# ---- Por que NO hay reglas propias aqui ----
# Con gitleaks 8.30.1, `[extend] useDefault = true` HACE QUE SE IGNOREN las
# `[[rules]]` propias de este fichero (comprobado: una regla de prueba para
# `tskey-...` no se dispara con useDefault=true, y si con useDefault=false).
# Como perder el ruleset por defecto seria peor, aqui no se anaden reglas.
#
# Los formatos que el ruleset por defecto se deja pasar (token de Telegram,
# webhook de Discord, clave de Tailscale, cadena de conexion con credenciales,
# .netrc) los caza `tools/check-privacidad.py`, que corre tambien en la CI.
